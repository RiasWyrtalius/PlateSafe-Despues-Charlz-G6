{% extends "base.html" %}
{% block title %}Edit Profile | PlateSafe{% endblock %}
{% block content %}
<h2>Edit Profile</h2>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save changes</button>
  <a href="{% url 'profile' %}">Cancel</a>
</form>
{% endblock %}

<div class="ps-field{% if field.errors %} ps-field--error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="ps-help">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="ps-error">{{ error }}</small>{% endfor %}
</div>
